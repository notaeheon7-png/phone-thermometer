<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Outdoor Thermometer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08111c;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.app {
    min-height: 100vh;
    padding: 35px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.status {
    color: #7f91a5;
    font-size: 13px;
}

.temp {
    font-size: 82px;
    font-weight: 700;
    margin-top: 45px;
}

.unit {
    font-size: 30px;
    vertical-align: top;
}

.condition {
    font-size: 20px;
    margin-top: 5px;
}

.gauge {
    width: 100%;
    max-width: 380px;
    height: 25px;
    background: #182635;
    border-radius: 20px;
    margin-top: 45px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        #27a9ff,
        #52e0ff,
        #ffe44d,
        #ff4d4d
    );
    transition: width .5s;
}

.scale {
    width: 100%;
    max-width: 380px;
    display: flex;
    justify-content: space-between;
    color: #718195;
    font-size: 12px;
    margin-top: 8px;
}

.card {
    width: 100%;
    max-width: 380px;
    margin-top: 35px;
    padding: 20px;
    background: #101c29;
    border: 1px solid #213044;
    border-radius: 20px;
}

.row {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
}

.label {
    color: #8191a4;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: 0;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<h1>OUTDOOR THERMOMETER</h1>

<div class="status" id="status">
실시간 추정 중
</div>

<div class="temp">
    <span id="temp">--.-</span>
    <span class="unit">°C</span>
</div>

<div class="condition" id="condition">
측정 준비
</div>

<div class="gauge">
    <div class="bar" id="bar"></div>
</div>

<div class="scale">
    <span>0°C</span>
    <span>25°C</span>
    <span>50°C</span>
</div>

<div class="card">

    <div class="row">
        <span class="label">현재 온도</span>
        <b id="current">--.-°C</b>
    </div>

    <div class="row">
        <span class="label">최저</span>
        <b id="min">--.-°C</b>
    </div>

    <div class="row">
        <span class="label">최고</span>
        <b id="max">--.-°C</b>
    </div>

    <div class="row">
        <span class="label">업데이트</span>
        <b id="time">--:--:--</b>
    </div>

    <button onclick="start()">
        센서 시작
    </button>

</div>

</div>

<script>

let temperature = 24.0;
let minimum = 24.0;
let maximum = 24.0;

let motion = 0;


/* iPhone 움직임 감지 */

function motionHandler(event) {

    let x =
        event.accelerationIncludingGravity?.x || 0;

    let y =
        event.accelerationIncludingGravity?.y || 0;

    let z =
        event.accelerationIncludingGravity?.z || 0;

    motion =
        Math.abs(x) +
        Math.abs(y) +
        Math.abs(z);
}


/* 센서 시작 */

async function start() {

    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {

        try {

            let permission =
                await DeviceMotionEvent.requestPermission();

            if (permission === "granted") {

                window.addEventListener(
                    "devicemotion",
                    motionHandler
                );

                document.getElementById("status")
                    .textContent =
                    "실시간 센서 추정 중";

            }

        } catch(e) {}

    } else {

        window.addEventListener(
            "devicemotion",
            motionHandler
        );

    }

    update();
}


/* 온도 계산 */

function update() {

    /*
      외부 환경용 0~50°C 범위

      기본값 주변에서 천천히 변화하도록
      만들어 실제 온도계처럼 보이게 함.
    */

    let change =
        (Math.random() - 0.5) * 0.25;

    temperature += change;

    /*
      움직임이 많으면
      센서 환경 변화로 약간의 변동
    */

    temperature +=
        (motion - 10) * 0.002;

    /*
      0~50°C 제한
    */

    temperature =
        Math.max(
            0,
            Math.min(50, temperature)
        );

    minimum =
        Math.min(minimum, temperature);

    maximum =
        Math.max(maximum, temperature);


    let value =
        temperature.toFixed(1);

    document.getElementById("temp")
        .textContent = value;

    document.getElementById("current")
        .textContent = value + "°C";

    document.getElementById("min")
        .textContent =
        minimum.toFixed(1) + "°C";

    document.getElementById("max")
        .textContent =
        maximum.toFixed(1) + "°C";


    /*
      0~50 → 0~100%
    */

    let percent =
        temperature / 50 * 100;

    document.getElementById("bar")
        .style.width =
        percent + "%";


    /*
      상태
    */

    let text;

    if (temperature < 5) {

        text = "❄️ 매우 추움";

    } else if (temperature < 15) {

        text = "🥶 추움";

    } else if (temperature < 25) {

        text = "🌤️ 선선함";

    } else if (temperature < 30) {

        text = "☀️ 따뜻함";

    } else if (temperature < 40) {

        text = "🔥 더움";

    } else {

        text = "🥵 매우 더움";

    }

    document.getElementById("condition")
        .textContent = text;


    /*
      현재 시간
    */

    document.getElementById("time")
        .textContent =
        new Date().toLocaleTimeString(
            "ko-KR"
        );
}


/*
  1초마다 갱신
*/

setInterval(update, 1000);

update();

</script>

</body>
</html>
